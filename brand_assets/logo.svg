<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 94" width="310" height="94">
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B6EF8"/>
      <stop offset="100%" stop-color="#0A1F7A"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B9CF6"/>
      <stop offset="100%" stop-color="#1A4ADB"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- === ICON: NEURAL NETWORK === -->

  <!-- Outer frame ring -->
  <circle cx="38" cy="38" r="34" fill="none" stroke="#8BBEFF" stroke-width="1" opacity="0.5" stroke-dasharray="3 5"/>

  <!-- Pulse rings around center -->
  <circle cx="38" cy="38" r="17" fill="none" stroke="#5B9CF6" stroke-width="1"   opacity="0.35"/>
  <circle cx="38" cy="38" r="24" fill="none" stroke="#5B9CF6" stroke-width="0.8" opacity="0.22"/>

  <!-- Cross-links (faint secondary connections) -->
  <line x1="38"  y1="6"  x2="66" y2="24" stroke="#4C7EF0" stroke-width="1"   stroke-linecap="round" opacity="0.3"/>
  <line x1="66"  y1="24" x2="62" y2="62" stroke="#4C7EF0" stroke-width="1"   stroke-linecap="round" opacity="0.3"/>
  <line x1="10"  y1="22" x2="8"  y2="56" stroke="#4C7EF0" stroke-width="0.8" stroke-linecap="round" opacity="0.25"/>
  <line x1="8"   y1="56" x2="62" y2="62" stroke="#4C7EF0" stroke-width="0.8" stroke-linecap="round" opacity="0.25"/>

  <!-- Primary connections from center -->
  <line x1="38" y1="26" x2="38" y2="9"   stroke="#2158E8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="47" y1="31" x2="64" y2="25"  stroke="#2158E8" stroke-width="2"   stroke-linecap="round" opacity="0.8"/>
  <line x1="46" y1="44" x2="61" y2="61"  stroke="#2158E8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="28" y1="42" x2="10" y2="57"  stroke="#2158E8" stroke-width="2"   stroke-linecap="round" opacity="0.8"/>
  <line x1="29" y1="30" x2="11" y2="21"  stroke="#2158E8" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Midpoint data-pulse dots on primary lines -->
  <circle cx="38" cy="17"  r="2"   fill="#5B9CF6" opacity="0.7"/>
  <circle cx="55" cy="28"  r="1.5" fill="#5B9CF6" opacity="0.6"/>
  <circle cx="54" cy="52"  r="2"   fill="#5B9CF6" opacity="0.7"/>
  <circle cx="19" cy="50"  r="1.5" fill="#5B9CF6" opacity="0.6"/>
  <circle cx="20" cy="25"  r="1.5" fill="#5B9CF6" opacity="0.6"/>

  <!-- Outer nodes -->
  <circle cx="11" cy="21"  r="4"   fill="url(#nodeGrad)" filter="url(#nodeGlow)"/>
  <circle cx="38" cy="6"   r="5.5" fill="url(#nodeGrad)" filter="url(#nodeGlow)"/>
  <circle cx="66" cy="24"  r="4.5" fill="url(#nodeGrad)" filter="url(#nodeGlow)"/>
  <circle cx="62" cy="62"  r="6"   fill="url(#nodeGrad)" filter="url(#nodeGlow)"/>
  <circle cx="9"  cy="57"  r="4"   fill="url(#nodeGrad)" filter="url(#nodeGlow)"/>

  <!-- Center glow aura -->
  <circle cx="38" cy="38" r="14" fill="#2158E8" opacity="0.2" filter="url(#glow)"/>

  <!-- Center node -->
  <circle cx="38" cy="38" r="11"  fill="url(#coreGrad)"/>
  <circle cx="38" cy="38" r="5.5" fill="white" opacity="0.95"/>
  <circle cx="38" cy="38" r="2.5" fill="#1A4ADB"/>

  <!-- === WORDMARK === -->
  <text
    x="86" y="46"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="32"
    font-weight="800"
    font-style="italic"
    letter-spacing="-1">
    <tspan fill="#ffffff">Biz</tspan><tspan fill="#5B9CF6">Matica</tspan>
  </text>

  <!-- === TAGLINE === -->
  <text
    x="93" y="68"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="9.5"
    font-weight="500"
    letter-spacing="0.8"
    fill="#8BBEFF"
    opacity="0.85">AUTOMATE. GROW. WIN.</text>
</svg>
