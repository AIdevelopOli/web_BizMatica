<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: sans-serif; background: #f1f5f9; padding: 40px; }</style>
</head>
<body>
<h2 style="font-family:sans-serif;font-size:14px;color:#666;margin-bottom:20px;">Originál vs. s overlay</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">

  <!-- Original -->
  <div>
    <p style="font-family:sans-serif;font-size:13px;color:#888;margin-bottom:8px;">Originál</p>
    <div style="border-radius:16px;overflow:hidden;">
      <img src="/blog_assets/flowchart-process.jpg" style="width:100%;height:300px;object-fit:cover;display:block;" />
    </div>
  </div>

  <!-- With overlay -->
  <div>
    <p style="font-family:sans-serif;font-size:13px;color:#888;margin-bottom:8px;">S overlay (brand barvy)</p>
    <div style="border-radius:16px;overflow:hidden;position:relative;">
      <img src="/blog_assets/flowchart-process.jpg" style="width:100%;height:300px;object-fit:cover;display:block;filter:saturate(0.4) brightness(1.05);" />
      <div style="position:absolute;inset:0;background:linear-gradient(135deg, rgba(3,10,30,0.55) 0%, rgba(26,74,219,0.35) 100%);"></div>
    </div>
  </div>

</div>
</body>
</html>
