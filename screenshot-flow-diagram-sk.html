<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #060D2E;
      width: 900px;
      padding: 56px 60px;
    }
    .title {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5B9CF6;
      text-align: center;
      margin-bottom: 48px;
    }
    .flow { display: flex; align-items: center; justify-content: center; gap: 0; }
    .node { display: flex; flex-direction: column; align-items: center; gap: 14px; flex-shrink: 0; }
    .node-icon { width: 72px; height: 72px; border-radius: 20px; display: flex; align-items: center; justify-content: center; position: relative; }
    .node-icon svg { width: 30px; height: 30px; }
    .node-label { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: #fff; text-align: center; letter-spacing: -0.01em; }
    .node-sub { font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; margin-top: -10px; max-width: 100px; line-height: 1.4; }
    .arrow { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; width: 80px; }
    .arrow-line { display: flex; align-items: center; width: 100%; margin-bottom: 28px; }
    .arrow-track { flex: 1; height: 2px; background: linear-gradient(90deg, rgba(59,110,248,0.6), rgba(91,156,246,0.8)); position: relative; }
    .arrow-head { width: 0; height: 0; border-top: 5px solid transparent; border-bottom: 5px solid transparent; border-left: 8px solid rgba(91,156,246,0.8); flex-shrink: 0; }
    .inputs { display: flex; flex-direction: column; gap: 20px; }
    .input-node { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 12px 16px; width: 150px; }
    .input-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .input-icon svg { width: 18px; height: 18px; }
    .input-text .name { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; color: #fff; }
    .input-text .desc { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 1px; }
    .ai-node { width: 110px; height: 110px; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: linear-gradient(135deg, #1A4ADB, #0A1F7A); border: 2px solid rgba(91,156,246,0.7); box-shadow: 0 0 40px rgba(59,110,248,0.5), 0 0 80px rgba(59,110,248,0.15); position: relative; }
    .ai-node::before { content: ''; position: absolute; inset: -4px; border-radius: 32px; background: transparent; border: 1px solid rgba(91,156,246,0.2); }
    .ai-node svg { width: 32px; height: 32px; }
    .ai-label { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 800; color: #fff; letter-spacing: 0.02em; }
    .outputs { display: flex; flex-direction: column; gap: 20px; }
    .output-node { display: flex; align-items: center; gap: 12px; border-radius: 14px; padding: 12px 16px; width: 168px; }
    .output-draft { background: rgba(52,168,83,0.1); border: 1px solid rgba(52,168,83,0.3); }
    .output-chat  { background: rgba(91,156,246,0.1); border: 1px solid rgba(91,156,246,0.3); }
    .output-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .output-icon svg { width: 18px; height: 18px; }
    .output-text .name { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; color: #fff; }
    .output-text .desc { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 1px; line-height: 1.3; }
    .kb-section { display: flex; flex-direction: column; align-items: center; gap: 0; margin-top: -20px; }
    .kb-connector { width: 2px; height: 36px; background: linear-gradient(180deg, rgba(59,110,248,0.6), rgba(59,110,248,0.2)); }
    .kb-node { background: rgba(59,110,248,0.1); border: 1px solid rgba(59,110,248,0.3); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; width: 170px; }
    .kb-icon { width: 30px; height: 30px; border-radius: 8px; background: rgba(59,110,248,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .kb-icon svg { width: 16px; height: 16px; }
    .kb-text .name { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.9); font-family: 'Syne', sans-serif; }
    .kb-text .desc { font-size: 10px; color: rgba(255,255,255,0.35); }
    .h-arrow { display: flex; align-items: center; width: 60px; flex-shrink: 0; }
    .h-arrow-track { flex: 1; height: 2px; background: linear-gradient(90deg, rgba(59,110,248,0.5), rgba(91,156,246,0.7)); }
    .h-arrow-head { width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 7px solid rgba(91,156,246,0.7); }
    .main-row { display: flex; align-items: center; gap: 0; }
    .center-col { display: flex; flex-direction: column; align-items: center; }
  </style>
</head>
<body>

<div class="title">Ako to funguje - AI zákaznícka podpora</div>

<div class="main-row" style="justify-content: center; gap: 20px;">

  <div class="inputs">
    <div class="input-node">
      <div class="input-icon" style="background: rgba(59,110,248,0.2);">
        <svg fill="none" stroke="#5B9CF6" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </div>
      <div class="input-text">
        <div class="name">E-mail</div>
        <div class="desc">Dopyt zákazníka</div>
      </div>
    </div>
    <div class="input-node">
      <div class="input-icon" style="background: rgba(91,156,246,0.2);">
        <svg fill="none" stroke="#5B9CF6" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
      </div>
      <div class="input-text">
        <div class="name">Chat</div>
        <div class="desc">Widget na webe</div>
      </div>
    </div>
  </div>

  <div class="h-arrow">
    <div class="h-arrow-track"></div>
    <div class="h-arrow-head"></div>
  </div>

  <div class="center-col">
    <div class="ai-node">
      <svg fill="none" stroke="white" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
      <div class="ai-label">AI Engine</div>
    </div>
    <div class="kb-section">
      <div class="kb-connector"></div>
      <div class="kb-node">
        <div class="kb-icon">
          <svg fill="none" stroke="#5B9CF6" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        <div class="kb-text">
          <div class="name">Znalostná báza</div>
          <div class="desc">FAQ · Pravidlá · Manuály</div>
        </div>
      </div>
    </div>
  </div>

  <div class="h-arrow">
    <div class="h-arrow-track"></div>
    <div class="h-arrow-head"></div>
  </div>

  <div class="outputs">
    <div class="output-node output-draft">
      <div class="output-icon" style="background: rgba(52,168,83,0.2);">
        <svg fill="none" stroke="#34a853" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </div>
      <div class="output-text">
        <div class="name" style="color:#34a853;">Návrh e-mailu</div>
        <div class="desc">Pripravené na kontrolu a odoslanie</div>
      </div>
    </div>
    <div class="output-node output-chat">
      <div class="output-icon" style="background: rgba(91,156,246,0.2);">
        <svg fill="none" stroke="#5B9CF6" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <div class="output-text">
        <div class="name" style="color:#5B9CF6;">Okamžitá odpoveď</div>
        <div class="desc">Doručené v priebehu sekúnd</div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
