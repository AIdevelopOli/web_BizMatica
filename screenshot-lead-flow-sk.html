<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8f9fb;
      width: 900px;
      padding: 52px 60px;
    }
    .title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #888;
      text-align: center;
      margin-bottom: 44px;
    }
    .main-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    .input-node {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 1.5px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px 18px;
      width: 158px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .input-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #eff6ff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .input-icon svg { width: 18px; height: 18px; }
    .input-text .name { font-size: 12px; font-weight: 700; color: #111; }
    .input-text .desc { font-size: 10px; color: #888; margin-top: 2px; }
    .h-arrow {
      display: flex;
      align-items: center;
      width: 52px;
      flex-shrink: 0;
    }
    .h-arrow-track { flex: 1; height: 2px; background: linear-gradient(90deg, #d1d5db, #9ca3af); }
    .h-arrow-head { width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 7px solid #9ca3af; flex-shrink: 0; }
    .ai-node {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #1a2a4a;
      border: 2px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(26,42,74,0.25);
      position: relative;
      flex-shrink: 0;
    }
    .ai-node svg { width: 30px; height: 30px; }
    .ai-label { font-size: 11px; font-weight: 700; color: #fff; letter-spacing: 0.02em; }
    .ai-sub { font-size: 9px; color: rgba(255,255,255,0.45); }
    .split-section {
      position: relative;
      height: 114px;
      width: 52px;
      flex-shrink: 0;
    }
    .sv { position: absolute; left: 0; top: 20px; bottom: 20px; width: 2px; background: #d1d5db; }
    .sh-top { position: absolute; left: 0; top: 20px; width: 100%; height: 2px; background: linear-gradient(90deg, #d1d5db, #9ca3af); }
    .sh-bot { position: absolute; left: 0; bottom: 20px; width: 100%; height: 2px; background: linear-gradient(90deg, #d1d5db, #9ca3af); }
    .arr-top { position: absolute; right: -1px; top: calc(20px - 4px); width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 7px solid #9ca3af; }
    .arr-bot { position: absolute; right: -1px; bottom: calc(20px - 4px); width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 7px solid #9ca3af; }
    .outputs {
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex-shrink: 0;
    }
    .output-node {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      border-radius: 14px;
      padding: 13px 16px;
      width: 196px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .output-high { background: #f0fdf4; border: 1.5px solid #bbf7d0; }
    .output-low  { background: #eff6ff; border: 1.5px solid #bfdbfe; }
    .output-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .output-icon svg { width: 16px; height: 16px; }
    .output-text .name { font-size: 12px; font-weight: 700; line-height: 1.2; margin-bottom: 3px; }
    .output-text .desc { font-size: 10px; color: #666; line-height: 1.4; }
  </style>
</head>
<body>

<div class="title">Ako to funguje — AI Kvalifikátor leadov</div>

<div class="main-row">

  <div class="input-node">
    <div class="input-icon">
      <svg fill="none" stroke="#3b82f6" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
    </div>
    <div class="input-text">
      <div class="name">Webový formulár</div>
      <div class="desc">Lead odošle dopyt</div>
    </div>
  </div>

  <div class="h-arrow">
    <div class="h-arrow-track"></div>
    <div class="h-arrow-head"></div>
  </div>

  <div class="ai-node">
    <svg fill="none" stroke="white" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
    <div class="ai-label">AI hodnotenie</div>
    <div class="ai-sub">&lt;2 s</div>
  </div>

  <div class="split-section">
    <div class="sv"></div>
    <div class="sh-top"></div>
    <div class="sh-bot"></div>
    <div class="arr-top"></div>
    <div class="arr-bot"></div>
  </div>

  <div class="outputs">
    <div class="output-node output-high">
      <div class="output-icon" style="background:#dcfce7;">
        <svg fill="none" stroke="#16a34a" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
      </div>
      <div class="output-text">
        <div class="name" style="color:#15803d;">Vysoký záujem</div>
        <div class="desc">Skóre ≥ 6 · Odporúčané prioritné oslovenie</div>
      </div>
    </div>
    <div class="output-node output-low">
      <div class="output-icon" style="background:#dbeafe;">
        <svg fill="none" stroke="#2563eb" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
      </div>
      <div class="output-text">
        <div class="name" style="color:#1d4ed8;">Nízky záujem</div>
        <div class="desc">Skóre &lt; 6 · Udržiavacia sekvencia</div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
